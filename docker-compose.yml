services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/orders
      DATABASE_AUTO_CREATE: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  test:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/orders
      DATABASE_AUTO_CREATE: "true"
      HOME: /app
      UV_CACHE_DIR: /app/.cache/uv
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - "uv sync --frozen --group dev && uv run pytest -q"
    profiles:
      - test

volumes:
  postgres_data:
