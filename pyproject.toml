[project]
name = "order-service"
version = "0.1.0"
description = "Order Service — Capashino integration (clean architecture)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/domain",
    "src/application",
    "src/infrastructure",
    "src/presentation",
]

[tool.hatch.build.targets.wheel.force-include]
"src/settings.py" = "settings.py"
"src/app.py" = "app.py"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "bin"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
